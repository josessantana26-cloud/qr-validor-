<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Validador</title>
<style>
body{font-family:-apple-system,sans-serif;display:flex;align-items:center;
justify-content:center;height:100vh;margin:0;color:#fff;
font-size:2.2rem;font-weight:700;text-align:center;background:#555}
</style></head>
<body><div id="r">Validando…</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm'
const sb = createClient('https://jwxxjprovqacakvtymfo.supabase.co','sb_publishable_AUzpm_S16RzLK8fk25RrPw_7M5W0GEk')
const code = new URLSearchParams(location.search).get('c')
let res = 'invalido'
try {
  const { data, error } = await sb.rpc('validar_qr',{ p_code: code })
  if (!error && data) res = data
} catch(e) {}
const m = {
  valido:['✅ VÁLIDO','#1a9d4b'],
  utilizado:['⚠️ YA UTILIZADO','#e08a00'],
  invalido:['❌ INVÁLIDO','#d62f2f']
}[res] || ['❌ INVÁLIDO','#d62f2f']
document.getElementById('r').textContent = m[0]
document.body.style.background = m[1]
</script></body></html>
